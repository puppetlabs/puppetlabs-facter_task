---
".gitlab-ci.yml":
  delete: true
appveyor.yml:
  delete: true
.rubocop.yml:
  include_todos: true

spec/spec_helper.rb:
  mock_with: ":rspec"
  coverage_report: true
.gitpod.Dockerfile:
  unmanaged: false
.gitpod.yml:
  unmanaged: false
.github/workflows/auto_release.yml:
  unmanaged: false
.github/workflows/ci.yml:
  unmanaged: false
.github/workflows/nightly.yml:
  unmanaged: false
  cron: '20 4 * * *'
  acceptance_flags:
    - '--nightly'
    - '--collection-platform-exclude 9:redhat-7'
    - '--collection-platform-exclude 9:centos-7'
    - '--collection-platform-exclude 9:oraclelinux-7'
    - '--collection-platform-exclude 9:debian-10'
    - '--collection-platform-exclude 9:ubuntu-18.04'
    - '--collection-platform-exclude 9:ubuntu-20.04'
.github/workflows/release.yml:
  unmanaged: false
.travis.yml:
  delete: true
